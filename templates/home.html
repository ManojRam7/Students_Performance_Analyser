<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Analyser | Score estimate</title>
    <style>
        :root {
            --bg: #f3f8f6;
            --panel: #ffffff;
            --ink: #203532;
            --muted: #607875;
            --primary: #0d9488;
            --primary-dark: #0a6f66;
            --accent: #f59e0b;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Avenir Next", "Trebuchet MS", sans-serif;
            background:
                radial-gradient(circle at 90% 10%, rgba(245, 158, 11, 0.2), transparent 30%),
                radial-gradient(circle at 10% 90%, rgba(13, 148, 136, 0.18), transparent 30%),
                var(--bg);
            color: var(--ink);
            padding: 24px;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            background: var(--panel);
            border-radius: 22px;
            border: 1px solid #d8e7e3;
            box-shadow: 0 16px 40px rgba(16, 24, 40, 0.08);
            overflow: hidden;
            animation: reveal 600ms ease;
        }

        .hero {
            padding: 28px 30px;
            background: linear-gradient(110deg, #d4f2ed, #fef5df);
            border-bottom: 1px solid #d8e7e3;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(1.4rem, 2.5vw, 2rem);
        }

        .hero p {
            margin: 8px 0 0;
            color: var(--muted);
        }

        form {
            padding: 22px 30px 30px;
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .field {
            display: grid;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 700;
            font-size: 0.92rem;
        }

        select,
        input {
            width: 100%;
            border: 1px solid #c9d9d5;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.95rem;
            color: var(--ink);
            background: #fbfefd;
        }

        .submit {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: 0;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(13, 148, 136, 0.3);
        }

        .result {
            margin: 0 30px 28px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #eefaf8;
            border: 1px solid #b9ebe4;
            font-weight: 700;
        }

        .error {
            margin: 0 30px 28px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #fff1f1;
            border: 1px solid #fecaca;
            color: var(--danger);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .hero {
                padding: 20px;
            }

            .result,
            .error {
                margin: 0 20px 20px;
            }
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>Estimate a Student's Maths Score</h1>
            <p>Provide profile and coursework details to estimate the student's math score.</p>
        </section>

        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <div class="field">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option selected disabled value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="field">
                <label for="ethnicity">Race/Ethnicity</label>
                <select id="ethnicity" name="ethnicity" required>
                    <option selected disabled value="">Select group</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="field">
                <label for="education">Parental Education</label>
                <select id="education" name="parental_level_of_education" required>
                    <option selected disabled value="">Select education</option>
                    <option value="associate's degree">Associate's degree</option>
                    <option value="bachelor's degree">Bachelor's degree</option>
                    <option value="high school">High school</option>
                    <option value="master's degree">Master's degree</option>
                    <option value="some college">Some college</option>
                    <option value="some high school">Some high school</option>
                </select>
            </div>

            <div class="field">
                <label for="lunch">Lunch Type</label>
                <select id="lunch" name="lunch" required>
                    <option selected disabled value="">Select lunch type</option>
                    <option value="free/reduced">Free/Reduced</option>
                    <option value="standard">Standard</option>
                </select>
            </div>

            <div class="field">
                <label for="prep">Test Preparation Course</label>
                <select id="prep" name="test_preparation_course" required>
                    <option selected disabled value="">Select status</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="field">
                <label for="reading_score">Reading Score (0-100)</label>
                <input id="reading_score" type="number" name="reading_score" min="0" max="100" required>
            </div>

            <div class="field">
                <label for="writing_score">Writing Score (0-100)</label>
                <input id="writing_score" type="number" name="writing_score" min="0" max="100" required>
            </div>

            <div class="field full">
                <button class="submit" type="submit">Predict Math Score</button>
            </div>
        </form>

        {% if results is defined %}
        <div class="result">Predicted Math Score: {{ results }}</div>
        {% endif %}

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </main>
</body>
</html>
