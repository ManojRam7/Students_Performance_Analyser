<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Performance Predictor</title>
	<style>
		:root {
			--bg-1: #f5f1e8;
			--bg-2: #e5efe4;
			--ink: #16302b;
			--accent: #d86f45;
			--accent-2: #296b73;
			--card: rgba(255, 255, 255, 0.82);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Avenir Next", "Trebuchet MS", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 80% 20%, #f9d8a8 0, transparent 35%),
				radial-gradient(circle at 15% 80%, #b9d9cc 0, transparent 35%),
				linear-gradient(135deg, var(--bg-1), var(--bg-2));
			display: grid;
			place-items: center;
			padding: 24px;
		}

		.wrap {
			width: min(880px, 100%);
			background: var(--card);
			border: 1px solid rgba(41, 107, 115, 0.2);
			border-radius: 24px;
			padding: 36px;
			box-shadow: 0 20px 60px rgba(22, 48, 43, 0.15);
			animation: rise 700ms ease-out;
		}

		.tag {
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.15rem;
			color: var(--accent-2);
			margin-bottom: 12px;
			font-weight: 700;
		}

		h1 {
			margin: 0;
			font-size: clamp(2rem, 5vw, 3.4rem);
			line-height: 1.1;
		}

		p {
			font-size: 1.03rem;
			line-height: 1.7;
			margin: 18px 0 26px;
			max-width: 65ch;
		}

		.cta {
			display: inline-block;
			background: linear-gradient(135deg, var(--accent), #c44a38);
			color: #fff;
			text-decoration: none;
			padding: 13px 20px;
			border-radius: 12px;
			font-weight: 700;
			letter-spacing: 0.01rem;
			transition: transform 180ms ease, box-shadow 180ms ease;
			box-shadow: 0 10px 24px rgba(216, 111, 69, 0.3);
		}

		.cta:hover {
			transform: translateY(-2px);
		}

		@keyframes rise {
			from { opacity: 0; transform: translateY(12px); }
			to { opacity: 1; transform: translateY(0); }
		}
	</style>
</head>
<body>
	<main class="wrap">
		<div class="tag">Exam score model</div>
		<h1>Student Exam Score Predictor</h1>
		<p>
			This end-to-end machine learning application predicts a student's math score from demographic and academic context.
			Use the interactive form to provide input features and instantly get a model prediction.
		</p>
		<a class="cta" href="{{ url_for('predict_datapoint') }}">Try Live Prediction</a>
	</main>
</body>
</html>
